name: Require no-slop
run-name: "no-slop-required|${{ github.event.action }}|${{ github.event.pull_request.updated_at }}|PR #${{ github.event.pull_request.number }} event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-slop-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-slop
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so the release pipeline keeps working:
    # - github-actions[bot] opens the release-please PR via GITHUB_TOKEN
    # - dependabot[bot] opens dependency update PRs
    # Other authors (human or bot) must raise PRs through `git push no-slop`.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - name: Verify no-slop signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          canonical_marker='Updates from [git push no-slop](https://github.com/Blakeolson21/no-slop)'
          legacy_marker='Updates from [git push no-mistakes](https://github.com/Blakeolson21/no-slop)'
          historical_legacy_marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if ! printf '%s' "${PR_BODY:-}" | grep -qF -- "$canonical_marker" &&
             ! printf '%s' "${PR_BODY:-}" | grep -qF -- "$legacy_marker" &&
             ! printf '%s' "${PR_BODY:-}" | grep -qF -- "$historical_legacy_marker"; then
            {
              echo "::error::This PR was not raised through no-slop."
              echo
              echo "Contributions to this repository must be submitted via 'git push no-slop'."
              echo "That pipeline runs the required review/test/lint/CI steps and writes a"
              echo "deterministic '## Pipeline' section into the PR body containing one of:"
              echo
              echo "    $canonical_marker"
              echo "    $legacy_marker"
              echo "    $historical_legacy_marker"
              echo
              echo "See CONTRIBUTING.md for setup and the full workflow."
              echo
              echo "PR author: ${PR_AUTHOR}"
            } >&2
            exit 1
          fi
          echo "Found no-slop signature in PR #${PR_NUMBER} body."
          python3 <<'PY'
          import json
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          pr_head_sha = os.environ.get("PR_HEAD_SHA") or ""
          prefix = "<!-- no-slop-pipeline-attestation:v1 "
          closing = " -->"
          required_steps = ("review", "test", "document")

          pipeline_heading = "## Pipeline\n\n"
          owned_markers = (
              "Updates from [git push no-slop](https://github.com/Blakeolson21/no-slop)",
              "Updates from [git push no-mistakes](https://github.com/Blakeolson21/no-slop)",
              "Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)",
          )

          def fail(message):
              sys.stderr.write(f"::error::{message}\n")
              raise SystemExit(1)

          section_start = body.rfind(pipeline_heading)
          if section_start < 0:
              fail("This PR is missing the no-slop v1 pipeline attestation. Re-run 'git push no-slop'.")
          pipeline = body[section_start + len(pipeline_heading):]
          signature, separator, owned_content = pipeline.partition("\n\n")
          if not separator or signature not in owned_markers or not owned_content.startswith(prefix):
              fail("This PR is missing the owned no-slop v1 pipeline attestation. Re-run 'git push no-slop'.")
          start = len(prefix)
          end = owned_content.find(closing, start)
          if end < 0:
              fail("The no-slop v1 pipeline attestation is malformed. Re-run 'git push no-slop'.")

          try:
              attestation = json.loads(owned_content[start:end])
          except json.JSONDecodeError:
              fail("The no-slop v1 pipeline attestation is malformed. Re-run 'git push no-slop'.")
          if not isinstance(attestation, dict) or not isinstance(attestation.get("steps"), list):
              fail("The no-slop v1 pipeline attestation is malformed. Re-run 'git push no-slop'.")

          publication_nonce = attestation.get("publication_nonce")
          if not isinstance(publication_nonce, str) or re.fullmatch(r"[0-9a-f]{32}", publication_nonce) is None:
              fail("The no-slop v1 pipeline attestation has no valid publication nonce. Re-run 'git push no-slop'.")
          print(f"NO_SLOP_PUBLICATION_NONCE={publication_nonce}")

          attested_head = attestation.get("head_sha")
          if not isinstance(attested_head, str) or not attested_head or attested_head != pr_head_sha:
              fail(
                  "Pipeline attestation head_sha does not match the current PR head "
                  f"(attested {attested_head or '(missing)'}, current {pr_head_sha or '(missing)'}). "
                  "Re-run 'git push no-slop'."
              )

          statuses = {}
          for item in attestation["steps"]:
              if not isinstance(item, dict):
                  fail("The no-slop v1 pipeline attestation contains a malformed step.")
              name, status, certified_head = item.get("step"), item.get("status"), item.get("head_sha", "")
              if not isinstance(name, str) or not isinstance(status, str) or not isinstance(certified_head, str):
                  fail("The no-slop v1 pipeline attestation contains a malformed step.")
              statuses[name] = (status, certified_head)

          incomplete = []
          for name in required_steps:
              status, certified_head = statuses.get(name, (None, None))
              if status != "completed":
                  incomplete.append(f"{name} (status={status})" if status else f"{name} (missing)")
              elif certified_head != pr_head_sha:
                  incomplete.append(
                      f"{name} (certified head={certified_head or '(missing)'}, current={pr_head_sha or '(missing)'})"
                  )
          if incomplete:
              fail("Required no-slop pipeline steps are not completed for the current PR head: " + ", ".join(incomplete))

          print("Found compliant no-slop pipeline attestation.")
          PY
